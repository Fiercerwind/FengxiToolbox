name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build onedir package
        shell: cmd
        run: |
          set FX_NO_PAUSE=1
          call package.bat

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist_release_ascii/fx_toolbox/fx_toolbox.exe")) {
            throw "Expected build output not found: dist_release_ascii/fx_toolbox/fx_toolbox.exe"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: fengxi-toolbox-windows-${{ github.run_number }}
          path: dist_release_ascii/fx_toolbox
          if-no-files-found: error
          retention-days: 14
